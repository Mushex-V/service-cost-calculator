<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="./dist/style.css">
</head>
<body>
    <header class="container">
        <h1>Calculating the Cost of Website Development</h1>
        <nav>
            <a href="https://github.com/Mushex-V" target="_blank">GitHub</a>
            <a href="https://t.me/Mushex_V" target="_blank">Telegram</a>
            <a href="mailto:mushexv0@gmail.com" target="_blank">Mail</a>
            <a href="tel:+374535717" target="_blank">Phone</a>
        </nav>
    </header>

    <main class="container">
        <form class="calculator" id="calculator-form">

            <div class="calculator-body">

                <section class="calculator-group">
                    <label for="service-type" class="calculator-label">Project type</label>
                        <select class="calculator-select" id="service-type">
                            <option value="100">Landing Page - start to $100</option>
                            <option value="250">Corporative site - start to $250</option>
                        </select>
                </section>

                <section class="calculator-group">
                    <div class="calculator-label-row">
                        <label for="pages-count" class="calculator-label">Number of Pages</label>
                        <span id="pages-value" class="calculator-value">1</span>
                    </div>
                    <input type="range" id="pages-count" class="calculator-range" min="1" max="15" value="1" step="1">
                </section>

                <section class="calculator-group">
                    <span class="calculator-label">Additional Options</span>
                    <div class="calculator-checkboxes">
                        <label class="checkbox">
                            <input type="checkbox" id="option-responsive" value="50" class="checkbox-input">
                            <span class="checkbox-text">Mobile Responsiveness ($50)</span>
                        </label>
                        <label class="checkbox">
                            <input type="checkbox" id="option-seo" value="40" class="checkbox-input">
                            <span class="checkbox-text">Basic SEO Optimization ($40)</span>
                        </label>
                        <label class="checkbox">
                            <input type="checkbox" id="option-urgent" value="1.3" class="checkbox-input">
                            <span class="checkbox-text">Rush Order (+30% of the price)</span>
                        </label>
                    </div>
                </section>
            </div>
            <aside>
                <h2 class="calculator-summary-title">Total Cost</h2>
                <div class="calculator-price">
                    <span id="total-price">$100</span>
                </div>
                <button type="button" class="calculator-btn">Order a Project</button>
            </aside>
        </form>
    </main>
    <footer class="container">
        <p class="footer__text">© 2026 Mushex-V. All rights reserved.</p>
    </footer>
</body>
</html>
